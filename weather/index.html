<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" type="text/css" href="src/reset.css">
  <link rel="stylesheet" type="text/css" href="src/style.css">
  <title>Frontend Mentor | Weather app</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body class="flex flex-col gap-[clamp(1.5rem,calc(2vw+1rem),3rem)] bg-neutral-900 px-4 py-4 md:p-8 lg:px-[clamp(2rem,calc(36vw-22rem),20rem)] lg:py-8">

  <header class="flex justify-between flex-row items-center">
    <div>
      <img src="./assets/images/logo.svg" class="w-34.5 h-7 md:h-10 md:w-auto" alt="logo">
    </div>
    <div class="relative flex flex-col">
      <button id="units_button_icon" class="flex flex-row gap-1 items-center justify-center rounded-lg md:rounded-lg bg-neutral-0-01 hover:bg-neutral-600 duration-100 w-22 h-8.5 md:w-30 md:h-10.5 md:gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="white">
          <path d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.92c.04-.3.07-.62.07-.93s-.03-.64-.07-1l2.12-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.36-.07.7-.07 1s.03.64.07 1l-2.11 1.66c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.58 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.66z"/>
        </svg>
        <span class="text-sm text-neutral-0 md:text-lg">Units</span>
        <img id="units_dropdown" src="./assets/images/icon-dropdown.svg" class="w-3 h-2 md:h-3 md:w-auto duration-200" alt="dropdown">
      </button>
      <div id="units_container" class="gap-0.5 opacity-0 absolute z-10 top-12 bg-neutral-800 duration-100 pt-3.5 pb-2 px-2 flex flex-col border border-neutral-600 w-53.5 h-auto right-0 rounded-lg pointer-events-none">
        <button id="switch_button"  class="text-lg text-neutral-0 text-left mb-4 ml-2">Switch to Metric</button>
        <div class="flex flex-col gap-2">
          <span class="text-md text-neutral-300 ml-2">Temperature</span>
          <div class="border-b-neutral-600 border-b pb-1">
            <button data-units="celsius" data-type="temperature" id="celsius_button" class="units_button w-full flex flex-row justify-between p-2 rounded-lg bg-neutral-700 duration-100">
              <span class="text-md text-neutral-0">Celsius (°C)</span>
              <img id="checkmark" class="opacity-100" src="./assets/images/icon-checkmark.svg" alt="icon-checkmark">
            </button>
            <button data-units="fahrenheit" data-type="temperature" id="fahrenheit_button" class="units_button w-full flex flex-row justify-between p-2 rounded-lg hover:bg-neutral-600 duration-100">
              <span class="text-md text-neutral-0">Fahrenheit (°F)</span>
              <img class="opacity-0" src="./assets/images/icon-checkmark.svg" alt="icon-checkmark">
            </button>
          </div>
        </div>

        <div class="flex flex-col gap-2 mt-2">
          <span class="text-md text-neutral-300 ml-2">Wind Speed</span>
          <div class="border-b-neutral-600 border-b pb-1">
            <button data-units="kmh" data-type="windSpeed" id="kmh_button" class="units_button w-full flex flex-row justify-between p-2 rounded-lg bg-neutral-700 duration-100">
              <span class="text-md text-neutral-0">km/h</span>
              <img class="opacity-100" src="./assets/images/icon-checkmark.svg" alt="icon-checkmark">
            </button>
            <button data-units="mph" data-type="windSpeed" id="mph_button" class="units_button w-full flex flex-row justify-between p-2 rounded-lg hover:bg-neutral-600 duration-100">
              <span class="text-md text-neutral-0">mp/h</span>
              <img class="opacity-0" src="./assets/images/icon-checkmark.svg" alt="icon-checkmark">
            </button>
          </div>
        </div>

        <div class="flex flex-col gap-2 mt-2">
          <span class="text-md text-neutral-300 ml-2">Precipitation</span>
          <div>
            <button id="mm_button" data-units="mm" data-type="precipitation" class="units_button w-full flex flex-row justify-between p-2 rounded-lg bg-neutral-700 duration-100">
              <span class="text-md text-neutral-0">Millimeters (mm)</span>
              <img class="opacity-100" src="./assets/images/icon-checkmark.svg" alt="icon-checkmark">
            </button>
            <button id="inch_button" data-units="inch" data-type="precipitation" class="units_button w-full flex flex-row justify-between p-2 rounded-lg hover:bg-neutral-600 duration-100">
              <span class="text-md text-neutral-0">Inches (in)</span>
              <img class="opacity-0" src="./assets/images/icon-checkmark.svg" alt="icon-checkmark">
            </button>
          </div>
        </div>
        
      </div>
    </div>
  </header>

  <h1 id="main-title" class="duration-500 text-5xl font-bold font-secondary text-neutral-0 tracking-wide text-center w-80 self-center md:w-100 lg:w-200 mt-[25vh]">How's the sky looking today?</h1>

  <main class="flex flex-col gap-8">
    <div class="flex flex-col md:flex-row gap-4 justify-center items-center">
      <div class="relative w-full md:w-4/5 lg:w-3/7 flex flex-col gap-3">
        <div class="w-full h-14 rounded-xl bg-neutral-0-01 p-2 flex flex-row gap-2 items-center px-4 duration-200 focus-within:bg-neutral-0-02 focus-within:shadow-md focus-within:shadow-blue-500/50">
          <img src="./assets/images/icon-search.svg" class="w-4 h-4 md:h-5 md:w-auto" alt="search icon">
          <input id="search-input" type="search" placeholder="Search for a place..." class=" w-full text-xl text-neutral-0 p-2"> 
        </div>
        <div id="search_options_container" class="absolute bg-neutral-0-01 rounded-xl overflow-scroll max-h-46 h-auto w-full top-17 opacity-0 duration-200"></div>
      </div>
      <button id="search-button" class="w-full md:w-1/5 lg:w-1/10 h-14 rounded-xl bg-blue-500 text-2xl text-neutral-0 hover:bg-blue-700 duration-100">Search</button>
    </div>

    <div id="main" class="hidden flex-col gap-8 lg:flex-row justify-center items-start">
      <div class="flex flex-col gap-8 w-full">
        <div class="flex flex-col gap-5">
          <div class=" py-8 flex flex-col md:flex-row md:justify-between md:px-12 items-center justify-center rounded-2xl gap-4 bg-[url('/assets/images/bg-today-small.svg')] md:bg-[url('/assets/images/bg-today-large.svg')] bg-no-repeat bg-center bg-cover w-full h-71.5">
            <div class="flex flex-col gap-2 justify-center">
              <span id="city-name" class="text-3xl font-bold text-neutral-0 text-center md:text-left">City, Country</span>
              <span id="date" class="text-neutral-0 text-md text-center md:text-left">day, date, year</span>
            </div>
            <div class="flex flex-row items-center justify-center gap-6">
              <img src="./assets/images/icon-sunny.webp" id="weather-icon" class="w-26 h-26 md:w-30 md:h-30 transform-x-2" alt="sun icon">
              <span id="temperature" class="text-8xl italic text-neutral-0 font-bold DM_Sans_italic">—</span>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4 md:grid-cols-4">

            <div class="p-5 flex flex-col gap-4 bg-neutral-0-01 rounded-2xl  h-29.5 justify-center">
              <span class="text-neutral-0 text-lg font-light ">Feels like</span>
              <span id="feels-like" class="text-3xl text-neutral-0 font-extralight">—</span>
            </div>

            <div class="p-5 flex flex-col gap-4 bg-neutral-0-01 rounded-2xl  h-29.5 justify-center">
              <span class="text-neutral-0 text-lg font-light">Humidity</span>
              <span id="humidity" class="text-3xl font-extralight text-neutral-0">—</span>
            </div>

            <div class="p-5 flex flex-col gap-4 bg-neutral-0-01 rounded-2xl  h-29.5 justify-center">
              <span class="text-neutral-0 text-lg font-light">Wind</span>
              <span id="wind-speed" class="text-3xl font-extralight text-neutral-0">—</span>
            </div>

            <div class="p-5 flex flex-col gap-4 bg-neutral-0-01 rounded-2xl  h-29.5 justify-center">
              <span class="text-neutral-0 text-lg font-light">Precipitation</span>
              <span id="precipitation" class="text-3xl font-extralight text-neutral-0">—</span>
            </div>
          </div>
        </div>
        
        <div class="flex flex-col gap-5">
          <h2 class="text-xl text-neutral-0">Daily forecast</h2>
          <div id="daily_forecast_container" class="grid grid-cols-3 md:grid-cols-7 gap-4">

          </div>
        </div>
      </div>
      
      <div class="py-4 px-4 flex flex-col bg-neutral-0-01 rounded-2xl w-full lg:w-3/6 h-171.25">
        <div class="flex flex-row justify-between items-center mb-4">
          <h2 class="text-neutral-0 text-lg">Hourly forecast</h2>
          <div class="relative flex flex-col">
            <button id="hourly_forecast_day" class="py-2 px-4 flex flex-row gap-3 rounded-xl h-9.5 w-auto justify-center items-center bg-neutral-700 duration-100 hover:bg-neutral-600">
              <span id="hourly_day_title" class="text-neutral-0 text-md">Today</span>
              <img id="hourly_forecast_day_icon" src="./assets/images/icon-dropdown.svg" class="duration-100 ease-in-out w-3 h-2 md:h-3 md:w-auto" alt="dropdown">
            </button>
            <div id="hourly_forecast_day_options" class="pointer-events-none opacity-0 absolute z-10 top-12 bg-neutral-700 duration-100 py-2 px-2 flex flex-col border border-neutral-600 w-45 h-auto right-0 rounded-lg"></div>
          </div>
        </div>
          <div id="hourly_forecast_container" class="flex flex-col gap-4 h-171.25 overflow-y-scroll pr-1">
          </div>
      </div>
    </div>
  </main>
  

 

  

  <script type="module" src="src/main.js"></script>
</body>
</html>
